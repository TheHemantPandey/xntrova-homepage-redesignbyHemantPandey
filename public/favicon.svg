<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0284C7" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Background High-Contrast Squircle Tile (Ensures 100% visibility on Dark Mode and Light Mode tabs) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.8" stroke-opacity="0.4" filter="url(#badgeShadow)" />
  <image href="data:image/png;base64," x="7" y="11" width="50" height="42" preserveAspectRatio="xMidYMid meet" />
</svg>